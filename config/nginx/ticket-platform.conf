# ==============================================================================
# CONFIGURATION NGINX OPTIMISÉE — TIKÉLI BILLETTERIE
# Fichier cible VPS : /etc/nginx/sites-available/ticket-platform
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Remplacer par le nom de domaine de production (ex: tikeli.ci www.tikeli.ci)

    root /var/www/ticket-platform;
    index index.php index.html;

    # Charset & Limite d'upload
    charset utf-8;
    client_max_body_size 20M;

    # Timeouts & Keepalive
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ==========================================================================
    # 1. COMPRESSION GZIP
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/bmp
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ==========================================================================
    # 2. SÉCURITÉ : FICHIERS & DOSSIERS SENSIBLES STRICTEMENT VERROUILLÉS
    # ==========================================================================
    # Bloquer .env, .git, .htaccess, etc.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloquer les dossiers de configuration et de base de données
    location ^~ /config/ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    location ^~ /database/ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # DOCUMENTS CONFIDENTIELS (Pièces d'identité & Justificatifs)
    # Strictement inaccessibles directement par HTTP pour protéger les utilisateurs
    location ^~ /uploads/ids/ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    location ^~ /uploads/event_docs/ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    location ^~ /scratch/ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # Interdire l'exécution de PHP dans le dossier uploads
    location ~* /uploads/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # ==========================================================================
    # 3. GESTION DES FICHIERS STATIQUES & CACHE NAVIGATEUR (Zero 404 to PHP)
    # ==========================================================================
    # Résolution transparente de la casse pour les CSS (/css/ -> Css/)
    location ^~ /css/ {
        alias /var/www/ticket-platform/Css/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Images, fonts, JS et autres médias publics
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        # IMPORTANT : =404 empêche impérativement toute redirection vers index.php
        # évitant ainsi la création d'URL fantômes type /css/client/accueil.php
        try_files $uri =404;
    }

    # ==========================================================================
    # 4. ROUTAGE PRINCIPAL
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==========================================================================
    # 5. TRAITEMENT PHP-FPM
    # ==========================================================================
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Socket du pool dédié ticket-platform (ou 127.0.0.1:9000 selon configuration)
        fastcgi_pass unix:/run/php/php8.2-fpm-ticket-platform.sock;
        # Fallback générique si le socket standard est utilisé :
        # fastcgi_pass unix:/run/php/php-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Buffers FastCGI pour réponses rapides
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
    }
}
