; ==============================================================================
; CONFIGURATION DU POOL PHP-FPM POUR TIKÉLI (ticket-platform)
; Emplacement cible VPS : /etc/php/8.x/fpm/pool.d/ticket-platform.conf
; Calibré spécifiquement pour un serveur disposant d'environ 3.8 Go de RAM
; ==============================================================================

[ticket-platform]

user = www-data
group = www-data

; Socket dédié
listen = /run/php/php8.2-fpm-ticket-platform.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ==============================================================================
; GESTION DES PROCESSUS (PROCESS MANAGEMENT)
; Calcul de mémoire :
; RAM totale : 3.8 Go
; Réservé PostgreSQL : ~1.2 Go
; Réservé Nginx & Système : ~1.0 Go
; Disponible pour PHP-FPM : ~1.6 Go
; Mémoire moyenne par worker PHP : ~50 à 60 Mo
; 25 workers * 60 Mo = ~1.5 Go (PARFAITEMENT SÉCURISÉ POUR 3.8 Go DE RAM)
; ==============================================================================

pm = dynamic
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10

; Recyclage périodique des processus workers pour prévenir toute fuite de mémoire
pm.max_requests = 1000

; Timeout d'exécution maximale pour éviter les processus zombis ou requêtes bloquées
request_terminate_timeout = 60s

; Statut et ping pour monitoring de santé interne
pm.status_path = /status
ping.path = /ping

; Limites système par worker
rlimit_files = 65535
rlimit_core = 0

; Journalisation & capture des erreurs PHP
catch_workers_output = yes
decorate_workers_output = no

; Directives PHP spécifiques au pool
php_admin_value[error_log] = /var/log/php-fpm/ticket-platform-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 60
